name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint + unit tests
        run: cd android && ./gradlew test lint
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: cd android && ./gradlew connectedDebugAndroidTest
      - name: Upload android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/

  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Install deps
        run: cd panel && npm ci
      - name: Install browsers
        run: cd panel && npx playwright install --with-deps chromium
      - name: Unit tests
        run: cd panel && npm test
      - name: E2E tests
        run: cd panel && npx playwright test
      - name: Upload panel reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panel-reports
          path: |
            panel/playwright-report/
            panel/test-results/
            panel/results.xml
